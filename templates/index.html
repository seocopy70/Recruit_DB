<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>팀 리크루팅 데이터베이스</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
        }
        body {
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            font-size: 0.95rem;
        }
        .navbar {
            flex-shrink: 0;
            padding-top: 0.4rem;
            padding-bottom: 0.4rem;
        }
        .navbar-brand { font-weight: bold; font-size: 1.05rem; }
        .version-badge {
            font-size: 0.7rem;
            font-weight: 600;
            vertical-align: middle;
            margin-left: 0.35rem;
            opacity: 0.9;
            letter-spacing: 0.02em;
        }
        .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }

        .app-main {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 0.5rem 0.5rem 0.4rem;
            width: 100%;
            max-width: 100%;
        }
        .top-actions {
            flex-shrink: 0;
            margin-bottom: 0.5rem;
        }
        .top-actions .btn,
        .top-actions .form-control {
            font-size: 0.95rem;
        }
        .table-card {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .table-card .card-body {
            flex: 1 1 auto;
            min-height: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }
        .table-responsive {
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            width: 100%;
        }
        .table {
            min-width: 720px;
            margin-bottom: 0;
            table-layout: auto;
        }
        .table th, .table td {
            white-space: nowrap;
            vertical-align: middle;
        }
        .table th {
            position: relative;
            user-select: none;
            font-size: 0.9rem;
            padding: 0.55rem 0.55rem;
            letter-spacing: -0.02em;
        }
        .table th.sortable { cursor: pointer; }
        .table th.sortable:hover { background-color: #1a1a1a !important; }
        .table td {
            font-size: 0.95rem;
            padding: 0.5rem 0.55rem;
        }

        /* 정렬: 큰 삼각형 하나만 */
        .sort-arrow {
            display: inline-block;
            margin-left: 4px;
            font-size: 0.85rem;
            line-height: 1;
            color: rgba(255, 255, 255, 0.4);
            vertical-align: middle;
        }
        .table th.sorted-asc .sort-arrow,
        .table th.sorted-desc .sort-arrow {
            color: #fff;
        }
        .table th.sorted-asc,
        .table th.sorted-desc {
            background-color: #0b5ed7 !important;
        }

        /* 목록용 컴팩트 드롭다운 칩 */
        .chip-dd {
            position: relative;
            display: inline-block;
            max-width: 108px;
        }
        .chip-dd > .btn {
            width: 100%;
            max-width: 108px;
            padding: 0.2rem 0.45rem;
            font-size: 0.78rem;
            font-weight: 600;
            line-height: 1.3;
            border-radius: 0.4rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: none;
        }
        .chip-dd > .btn::after {
            margin-left: 0.25rem;
            vertical-align: 0.1em;
        }
        .chip-dd .dropdown-menu {
            min-width: 9.5rem;
            padding: 0.35rem;
            border: none;
            border-radius: 0.6rem;
            box-shadow: 0 0.5rem 1.25rem rgba(0,0,0,0.15);
            font-size: 0.85rem;
        }
        .chip-dd .dropdown-item {
            border-radius: 0.4rem;
            padding: 0.4rem 0.65rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .chip-dd .dropdown-item:hover,
        .chip-dd .dropdown-item:focus {
            background-color: #e9ecef;
        }
        .chip-dd .dropdown-item.active {
            background-color: #e7f1ff;
            color: #0d6efd;
            font-weight: 700;
        }
        .chip-dd .dropdown-item .check {
            width: 0.9rem;
            color: #0d6efd;
            visibility: hidden;
        }
        .chip-dd .dropdown-item.active .check {
            visibility: visible;
        }
        /* 진행단계 칩 */
        .chip-status {
            background: #eef2f7;
            border: 1px solid #cfd8e3;
            color: #334155;
        }
        .chip-status:hover, .chip-status:focus, .chip-status.show {
            background: #e2e8f0;
            border-color: #94a3b8;
            color: #1e293b;
        }
        /* 최종결과 칩 색 */
        .chip-result-ing {
            background: #d1e7dd;
            border: 1px solid #a3cfbb;
            color: #0f5132;
        }
        .chip-result-quit {
            background: #f8d7da;
            border: 1px solid #f1aeb5;
            color: #842029;
        }
        .chip-result-done {
            background: #fff3cd;
            border: 1px solid #ffe69c;
            color: #664d03;
        }
        .chip-result-ing:hover, .chip-result-ing.show,
        .chip-result-quit:hover, .chip-result-quit.show,
        .chip-result-done:hover, .chip-result-done.show {
            filter: brightness(0.97);
        }
        /* 드롭다운 안 결과 색 점 */
        .opt-dot {
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .opt-dot-ing { background: #198754; }
        .opt-dot-quit { background: #dc3545; }
        .opt-dot-done { background: #ffc107; }

        /* 추천인 색상 */
        .manager-chip {
            display: inline-block;
            padding: 0.15em 0.5em;
            border-radius: 0.35rem;
            font-size: 0.78rem;
            font-weight: 600;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* 추천인 색 — 확실히 구분되는 12색 (빨강 계통 제외) */
        .mgr-c0  { background: #198754; color: #fff; }       /* 진한 초록 */
        .mgr-c1  { background: #ffc107; color: #212529; }    /* 노랑 */
        .mgr-c2  { background: #0d6efd; color: #fff; }       /* 파랑 */
        .mgr-c3  { background: #0dcaf0; color: #052c65; }    /* 시안 */
        .mgr-c4  { background: #6f42c1; color: #fff; }       /* 보라 */
        .mgr-c5  { background: #20c997; color: #052e24; }    /* 청록 */
        .mgr-c6  { background: #fd7e14; color: #fff; }       /* 주황 */
        .mgr-c7  { background: #6610f2; color: #fff; }       /* 인디고 */
        .mgr-c8  { background: #343a40; color: #fff; }       /* 차콜 */
        .mgr-c9  { background: #6c757d; color: #fff; }       /* 회색 */
        .mgr-c10 { background: #0a58ca; color: #fff; }       /* 남색 */
        .mgr-c11 { background: #087f5b; color: #fff; }       /* 딥 민트 */

        .memo-cell {
            max-width: 280px;
            min-width: 160px;
            cursor: pointer;
            color: #0d6efd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .memo-cell:hover {
            text-decoration: underline;
            background-color: #e7f1ff;
        }
        .memo-cell.empty {
            color: #adb5bd;
            font-style: italic;
        }

        .memo-readonly {
            background-color: #f1f3f5;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 0.75rem;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 120px;
            overflow-y: auto;
            font-size: 0.9rem;
            color: #495057;
            line-height: 1.5;
        }
        .memo-readonly:empty::before {
            content: "(이전 메모 없음)";
            color: #adb5bd;
            font-style: italic;
        }

        /* 모달: 배경(modal) 자체를 스크롤 — iOS/Android에서 가장 안정적 */
        .modal {
            overflow-y: scroll !important;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }
        .modal-dialog {
            margin: 1rem auto;
            max-width: 400px;
            width: calc(100% - 1.5rem);
        }
        /* scrollable 클래스의 내부 스크롤 비활성화 → 바깥 모달이 스크롤 */
        .modal-dialog-scrollable {
            max-height: none;
        }
        .modal-dialog-scrollable .modal-content {
            max-height: none;
            overflow: visible;
        }
        .modal-dialog-scrollable .modal-body {
            overflow: visible;
        }
        .modal-body {
            padding-bottom: 1.25rem;
        }

        /* 좌측 핵심 열 고정: 가로 스크롤해도 번호와 이름은 계속 표시 */
        .table th:nth-child(1),
        .table td:nth-child(1) {
            position: sticky;
            left: 0;
            width: 34px;
            min-width: 34px;
            max-width: 34px;
            z-index: 4;
            box-shadow: 1px 0 0 rgba(0, 0, 0, 0.06);
        }
        .table th:nth-child(2),
        .table td:nth-child(2) {
            position: sticky;
            left: 34px;
            width: 72px;
            min-width: 72px;
            max-width: 72px;
            z-index: 4;
            box-shadow: 1px 0 0 rgba(0, 0, 0, 0.06);
        }
        .table thead th:nth-child(1),
        .table thead th:nth-child(2) {
            z-index: 6;
            background-color: #212529;
        }


        /* 고정 열은 표의 기존 줄무늬/호버 배경을 그대로 사용해 자연스럽게 표시 */
        .table tbody .id-cell,
        .table tbody .name-cell {
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .table tbody .name-cell {
            font-size: 0.9rem;
        }
        .table tbody tr:hover .id-cell,
        .table tbody tr:hover .name-cell {
            background-color: var(--bs-table-hover-bg);
        }
        .table tbody tr:nth-of-type(odd) .id-cell,
        .table tbody tr:nth-of-type(odd) .name-cell {
            background-color: var(--bs-table-striped-bg);
        }
        .table tbody tr:nth-of-type(odd):hover .id-cell,
        .table tbody tr:nth-of-type(odd):hover .name-cell {
            background-color: var(--bs-table-hover-bg);
        }

        /* 목록 헤더 고정 */
        .table thead th {
            position: sticky;
            top: 0;
            z-index: 3;
            box-shadow: 0 1px 0 rgba(0,0,0,0.15);
        }

        @media (max-width: 768px) {
            .navbar-text { display: none; }
            .app-main { padding: 0.4rem 0.35rem 0.3rem; }
            .table th { font-size: 0.85rem; padding: 0.45rem 0.4rem; }
            .table td { font-size: 0.9rem; padding: 0.4rem 0.4rem; }
            .chip-dd { max-width: 100px; }
            .chip-dd > .btn { max-width: 100px; font-size: 0.74rem; }
            .memo-cell { max-width: 220px; min-width: 140px; }
            .table { min-width: 680px; }
            .modal-dialog {
                margin: 0.75rem auto;
                max-width: 400px;
                width: calc(100% - 1.2rem);
            }
        }

        .table-responsive::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .table-responsive::-webkit-scrollbar-thumb {
            background: #adb5bd;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid px-2 px-md-3">
            <a class="navbar-brand" href="#">
                <i class="fas fa-users-cog me-2"></i>팀 리크루팅 DB
                <span class="badge bg-light text-primary version-badge">v0.2</span>
            </a>
            <span class="navbar-text text-light d-none d-md-inline">어디서나 편하게 기록하고 조회하는 리크루팅 관리 시스템</span>
        </div>
    </nav>

    <div class="app-main">
        <div class="top-actions">
            <div class="row g-2 align-items-center">
                <div class="col-6">
                    <button class="btn btn-success w-100" data-bs-toggle="modal" data-bs-target="#candidateModal" onclick="openAddModal()">
                        <i class="fas fa-user-plus me-1"></i> 후보자 등록
                    </button>
                </div>
                <div class="col-6">
                    <div class="input-group">
                        <input type="text" id="searchInput" class="form-control" placeholder="이름, 연락처, 추천인, 메모 검색..." onkeyup="filterCandidates()">
                        <button class="btn btn-outline-secondary" type="button" onclick="loadCandidates()" title="새로고침">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card table-card">
            <div class="card-body">
                <div class="table-responsive" id="tableScrollArea">
                    <table class="table table-hover table-striped mb-0 align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th class="sortable text-nowrap id-header" onclick="sortTable('updated_at')" title="수정 시각 기준 정렬"><span class="sort-arrow" data-col="updated_at">▼</span></th>
                                <th>이름</th>
                                <th>연락처</th>
                                <th class="sortable" onclick="sortTable('contact_date')">
                                    접촉일 <span class="sort-arrow" data-col="contact_date">▼</span>
                                </th>
                                <th class="sortable" onclick="sortTable('manager')">
                                    추천인 <span class="sort-arrow" data-col="manager">▼</span>
                                </th>
                                <th>진행단계</th>
                                <th class="sortable" onclick="sortTable('result')">
                                    최종결과 <span class="sort-arrow" data-col="result">▼</span>
                                </th>
                                <th>메모</th>
                                <th class="text-center" style="width:90px">관리</th>
                            </tr>
                        </thead>
                        <tbody id="candidateTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Candidate Modal -->
    <div class="modal fade" id="candidateModal" tabindex="-1" aria-labelledby="candidateModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
                <form id="candidateForm" onsubmit="saveCandidate(event)">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="candidateModalLabel">후보자 등록</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="candidateId">
                        <div class="mb-2">
                            <label for="name" class="form-label mb-1">이름 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-sm" id="name" required>
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label for="contact" class="form-label mb-1">연락처</label>
                                <input type="text" class="form-control form-control-sm" id="contact" placeholder="전화/이메일">
                            </div>
                            <div class="col-6">
                                <label for="contact_date" class="form-label mb-1">접촉일</label>
                                <input type="date" class="form-control form-control-sm" id="contact_date">
                            </div>
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label for="manager" class="form-label mb-1">추천인</label>
                                <input type="text" class="form-control form-control-sm" id="manager" placeholder="추천인">
                            </div>
                            <div class="col-6">
                                <label for="status" class="form-label mb-1">진행단계</label>
                                <select class="form-select form-select-sm" id="status">
                                    <option value="포지션 수락">포지션 수락</option>
                                    <option value="잡페어 참석">잡페어 참석</option>
                                    <option value="TS 진행">TS 진행</option>
                                    <option value="교육 입과">교육 입과</option>
                                    <option value="등록">등록</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-2">
                            <label for="result" class="form-label mb-1">최종결과</label>
                            <select class="form-select form-select-sm" id="result">
                                <option value="진행 중">진행 중</option>
                                <option value="등록">등록</option>
                                <option value="등록포기">등록포기</option>
                            </select>
                        </div>
                        <div class="mb-2" id="memoHistoryWrapper" style="display:none;">
                            <label class="form-label mb-1">이전 메모 <span class="text-muted" style="font-weight:normal;">(읽기 전용)</span></label>
                            <div class="memo-readonly" id="memoHistoryDisplay"></div>
                        </div>
                        <div class="mb-1">
                            <label for="memo" class="form-label mb-1">새 메모 추가</label>
                            <textarea class="form-control form-control-sm" id="memo" rows="2" placeholder="입력 시 날짜와 함께 자동 기록됩니다."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-primary" id="saveBtn">저장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Memo Modal -->
    <div class="modal fade" id="memoModal" tabindex="-1" aria-labelledby="memoModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-info text-dark">
                    <h5 class="modal-title" id="memoModalLabel">메모</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="memoCandidateId">
                    <p class="mb-2 small text-muted" id="memoCandidateName"></p>
                    <div class="mb-3">
                        <label class="form-label">이전 메모 <span class="text-muted">(읽기 전용)</span></label>
                        <div class="memo-readonly" id="memoReadonlyDisplay"></div>
                    </div>
                    <div class="mb-0">
                        <label for="memoNewInput" class="form-label">새 메모 추가</label>
                        <textarea class="form-control" id="memoNewInput" rows="3" placeholder="내용을 입력하면 날짜와 함께 자동으로 추가됩니다."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                    <button type="button" class="btn btn-primary" onclick="saveMemoOnly()">메모 저장</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let candidatesData = [];
        let modalInstance = null;
        let memoModalInstance = null;
        let currentSortColumn = 'updated_at';
        let currentSortDirection = 'desc';

        const STATUS_OPTIONS = ['포지션 수락', '잡페어 참석', 'TS 진행', '교육 입과', '등록'];
        const RESULT_OPTIONS = ['진행 중', '등록', '등록포기'];
        const APP_VERSION = 'v0.2';

        document.addEventListener('DOMContentLoaded', () => {
            modalInstance = new bootstrap.Modal(document.getElementById('candidateModal'));
            memoModalInstance = new bootstrap.Modal(document.getElementById('memoModal'));
            loadCandidates();
        });
